<section class="weather-map-card">
  <header class="weather-map-header">
    <div>
      <span>Precipitation</span>
      <h2>Weather map</h2>
    </div>

    <strong [class.error]="mapUnavailable">
      {{ mapStatus }}
    </strong>
  </header>

  <div id="windy" #windyContainer class="windy-map"></div>
</section>
