<section
  class="weather-map-card"
  [class.expanded]="isExpanded"
  (click)="openExpanded()"
>
  <header class="weather-map-header">
    <div>
      <span>Precipitation</span>
      <h2>Weather map</h2>
    </div>

    <div class="weather-map-actions">
      <strong [class.error]="radarUnavailable">
        {{ radarStatus }}
      </strong>

      <button
        type="button"
        class="weather-map-close"
        aria-label="Close expanded map"
        (click)="closeExpanded($event)"
      >
        x
      </button>
    </div>
  </header>

  <div #mapContainer class="weather-map"></div>

  <footer class="weather-map-details">
    <div>
      <span>Place</span>
      <strong>{{ locationLabel }}</strong>
    </div>

    <div>
      <span>Coordinates</span>
      <strong>{{ coordinatesLabel }}</strong>
    </div>

    <div>
      <span>Radar</span>
      <strong>{{ radarDetails }}</strong>
    </div>

    <div>
      <span>Updated</span>
      <strong>{{ lastRadarUpdate || '--:--' }}</strong>
    </div>
  </footer>

  <footer class="weather-map-legend">
    <span>Light</span>
    <div></div>
    <span>Heavy</span>
  </footer>
</section>
